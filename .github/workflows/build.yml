name: build
concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
on:
  merge_group:
  push:
    branches:
      - "main"
  pull_request:
    paths:
      - "go.*"
      - "**/*.go"
      - "**/*.golden"
      - "Taskfile.yml"
      - "Dockerfile"
      - ".github/workflows/*.yml"
      # XXX: these dirs might have yml, txt, and golden files that when changed
      # need to trigger CI as well
      - "cmd/**/*"
      - "pkg/**/*"
      - "internal/**/*"
permissions:
  contents: read
jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task licenses:check
  semgrep:
    uses: caarlos0/meta/.github/workflows/semgrep.yml@c7f17af352dac91fa6c785d06ebac8547f1abdd3 # v0.1.0
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          # -count=1 turns the go test cache off. CI never gets a hit from it:
          # every run is a new commit, and on ubuntu -coverpkg=./... makes each
          # test binary depend on every package, so all 124 are invalidated
          # (measured: 0 of 124 cached, every run). The cost is still paid,
          # though. With the cache on, go passes -test.testlogfile to every
          # test binary and then hashes every file each test touched to build
          # the key, and this suite opens a lot of files: internal/pipe/archive
          # alone logs 1887 operations. File metadata calls cost far more on
          # windows, so it suffered most: measured on one runner back to back,
          # identical flags apart from -count=1, 331s with the cache on and
          # 129s without.
          - os: ubuntu-latest
            test-args: TEST_OPTIONS=-count=1
          # the race detector is OS-independent and coverage is only uploaded
          # from ubuntu, so skip both on windows to speed up the slowest job.
          - os: windows-latest
            test-args: RACE=false COVER=false TEST_OPTIONS=-count=1
    runs-on: ${{ matrix.os }}
    env:
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: use-fast-disk
        # D: is the runner's local SSD, and GitHub already puts the workspace
        # and RUNNER_TEMP there. The Go caches and %TMP% still default to C:,
        # the network-attached OS disk, so every build artifact and all 472
        # t.TempDir() trees the suite creates land on the slow disk. This must
        # run before setup-go, which reads `go env GOCACHE`/`GOMODCACHE` to
        # decide which directories to cache.
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\tmp, D:\gocache, D:\gomodcache | Out-Null
          @(
            "GOTMPDIR=D:\tmp"
            "TMP=D:\tmp"
            "TEMP=D:\tmp"
            "GOCACHE=D:\gocache"
            "GOMODCACHE=D:\gomodcache"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: matrix.os == 'ubuntu-latest'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: matrix.os == 'ubuntu-latest'
        with:
          driver-opts: network=host
      - name: setup-snapcraft
        if: matrix.os == 'ubuntu-latest'
        run: sudo snap install snapcraft --classic
      - uses: crazy-max/ghaction-upx@c83f378efc804f828e988debb88ed6116feb2368 # v4.0.0
        with:
          install-only: true
      - name: install-flatpak-makeself
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update -q
          sudo apt install -yq makeself flatpak flatpak-builder
      - name: cache-flatpak
        id: cache-flatpak
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: flatpak-${{ runner.os }}-freedesktop-24.08
      - name: setup-flatpak
        # runtimes are installed --user so the cache (runner-owned) can restore
        # them without sudo; only download on a cache miss.
        if: matrix.os == 'ubuntu-latest' && steps.cache-flatpak.outputs.cache-hit != 'true'
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user --noninteractive flathub org.freedesktop.Platform/x86_64/24.08 org.freedesktop.Sdk/x86_64/24.08 org.freedesktop.Platform/aarch64/24.08 org.freedesktop.Sdk/aarch64/24.08
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        if: matrix.os == 'ubuntu-latest'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: setup-nix-formatters
        # `nix profile add nixpkgs#...` resolves and builds from nixpkgs, which
        # took 18s. Both projects publish static linux binaries, so fetching
        # them directly takes about a second. It also pins the versions: the
        # format tests compare against golden files, so floating with whatever
        # nixpkgs currently ships could break them at any time.
        #
        # Release assets are mutable and dependabot can't see a URL in a `run`
        # block, so the checksums pin the contents, not just the tag.
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/alejandra" \
            https://github.com/kamadorueda/alejandra/releases/download/4.0.0/alejandra-x86_64-unknown-linux-musl
          curl -fsSL -o "$HOME/.local/bin/nixfmt" \
            https://github.com/NixOS/nixfmt/releases/download/v1.4.0/nixfmt
          echo "a23b9d47cba945805c6169541046de890e94e07a5aa416c86dee15bca2da6216  $HOME/.local/bin/alejandra" | sha256sum -c -
          echo "62488394d5233283096466350487ed46470366f57db4bec824a87ecbacce960a  $HOME/.local/bin/nixfmt" | sha256sum -c -
          chmod +x "$HOME/.local/bin/alejandra" "$HOME/.local/bin/nixfmt"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # setup-go keys its cache on the hash of these files only, and saves
          # it just once per key. license-check and golangci-lint resolve the
          # same key and always finish first, so this job kept restoring a
          # build cache without the -race/-coverpkg objects and recompiled
          # everything (~2.5min). Taskfile.yml holds the test flags, so hashing
          # it too gives this job a key of its own that it can populate.
          cache-dependency-path: |
            go.sum
            Taskfile.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.16.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - uses: cargo-bins/cargo-binstall@75b4bfae1b2c753a6806bbce6e6cb89b602de33c # v1.22.0
      - name: setup-cargo
        run: |
          rustup default stable
          cargo binstall cargo-zigbuild
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: setup-poetry
        # uv installs poetry into ~/.local/bin in about 2s. The dedicated
        # action built a virtualenv with pip instead, which took 13s on ubuntu
        # and 31s on windows.
        run: uv tool install poetry
      - if: matrix.os == 'windows-latest'
        run: 'echo "C:\Users\runneradmin\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.3"
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - run: task setup
      - run: task build
      - run: task test ${{ matrix.test-args }}
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          file: ./coverage.txt
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - run: git diff
        if: ${{ always() }}
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser-pro
          version: "~> 2"
          args: check
        env:
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
  golangci:
    permissions:
      contents: read
      pull-requests: read
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=10m
