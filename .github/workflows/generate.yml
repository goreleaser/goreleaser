name: generate
on:
  workflow_dispatch: {}
  release:
    types:
      - published
  schedule:
    - cron: "0 8 * * *"
permissions: read-all
jobs:
  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "install gofumpt"
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: mvdan/gofumpt
          tag: v0.10.0
          extension-matching: disable
          rename-to: gofumpt
          chmod: 0755
      - name: "install jv"
        uses: jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8 # v4.0.0
        with:
          repo: santhosh-tekuri/jsonschema
          tag: v6.0.2
      - run: task docs:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: task docs:generate
      - name: "install sponsors"
        run: npm install -g @goreleaser/sponsors@0.3.8
      - run: task docs:sponsors
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}
      - run: task schema:generate
      - run: task schema:validate
      - run: task nix:licenses:generate
      - run: task nodedist:releases:generate
      - name: "create repository token"
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: repository-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: "get repository app identity"
        id: repository-identity
        env:
          GH_TOKEN: ${{ steps.repository-token.outputs.token }}
          APP_SLUG: ${{ steps.repository-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          echo "identity=${APP_SLUG}[bot] <${user_id}+${APP_SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.repository-token.outputs.token }}
          branch: auto-update-generated-files
          base: main
          delete-branch: true
          title: "chore: auto-update generated files"
          commit-message: "chore: auto-update generated files"
          author: ${{ steps.repository-identity.outputs.identity }}
          committer: ${{ steps.repository-identity.outputs.identity }}
          body: |
            Automated update of generated files.

            Generated by the [generate](https://github.com/goreleaser/goreleaser/actions/workflows/generate.yml) workflow.
  notify:
    runs-on: ubuntu-latest
    needs:
      - docs
    permissions:
      contents: read
    if: ${{ failure() }}
    steps:
      - name: Notify
        uses: appleboy/telegram-action@68ac04bda0e0f4755e24649161566b4b6732cc83 # v1.1.2
        with:
          to: ${{ secrets.TELEGRAM_NIGHTLY_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          disable_web_page_preview: true
          message: |
            generate job failed, this may cause goreleaser-action to fail, please check:

            https://github.com/goreleaser/goreleaser/actions/workflows/generate.yml
