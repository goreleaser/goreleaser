# shamelessly copied from https://github.com/sigstore/cosign/blob/main/.github/workflows/milestone.yaml

name: milestone

on:
  pull_request_target:
    types: [closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  milestone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (!context.payload.pull_request.merged) {
              console.log('PR was not merged, skipping.');
              return;
            }

            if (!!context.payload.pull_request.milestone) {
              console.log('PR has existing milestone, skipping.');
              return;
            }

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            })

            // milestones are named after the release they'll go out in, so pick
            // the lowest version: due dates are never set, and any other order
            // would milestone this PR into some far away future release.
            const parse = (title) => {
              const m = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(title.trim());
              return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
            };
            const next = milestones
              .map((milestone) => ({ milestone, version: parse(milestone.title) }))
              .filter(({ version }) => version !== null)
              .sort((a, b) =>
                a.version[0] - b.version[0] ||
                a.version[1] - b.version[1] ||
                a.version[2] - b.version[2]
              )[0];

            if (!next) {
              console.log('There are no open versioned milestones, skipping.');
              return;
            }

            console.log(`Setting milestone to ${next.milestone.title}.`);
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              milestone: next.milestone.number
            });
